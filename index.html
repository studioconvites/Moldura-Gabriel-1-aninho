<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANTHONY FAZ 1 ANINHO</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #video, #overlay {
      position: absolute;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #overlay { pointer-events: none; }

    #buttons {
      position: absolute;
      bottom: 50px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }

    button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #preview-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    #photo-preview {
      width: 85vw;
      max-width: 280px;
      border: 3px solid white;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    #save-btn, #retry-btn {
      background: #fcd42d;
      color: white;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 15px;
      margin-top: 5px;
      width: 160px;
    }

    #instructions {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      background-color: rgba(0,0,0,0.6);
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
      text-align: center;
      max-width: 90%;
    }

  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <IMG ID="Sobreposição" SRC="moldura.png" Alt.="Moldura" />

  <Div. ID="botões">
    <Botão ID="Switch-Camera">🔄</Botão>
    <Botão ID="Captura">📸</Botão>
  </Div.>

  <Tela ID="canvas" Estilo="Exibição: nenhuma;"

">"preview-container">
    <IMG ID="Foto-previsão" />
    <Botão ID="Save-BN">Salvar na galeria</Botão>
    <Botão ID="Retry-BN">Tirar outra</Botão>

    <Div. ID="Instruções">
       Se estiver no iPhone: <Br.>
       Toque e segure a imagem e selecione “Salvar na Fototeca”. 
    </Div.>
  </Div.>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const canvas = document.getElementById('canvas');

    const switchCameraBtn = document.getElementById('switch-camera');
    const captureBtn = document.getElementById('capture');

    const previewContainer = document.getElementById('preview-container');
    const photoPreview = document.getElementById('photo-preview');
    const saveBtn = document.getElementById('save-btn');
    const retryBtn = document.getElementById('retry-btn');
    const instructions = document.getElementById('instructions');

    let usingFrontCamera = true;
    let stream;

    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: usingFrontCamera ? 'user' : 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      video.srcObject = stream;
      video.style.transform = usingFrontCamera ? 'scaleX(-1)' : 'scaleX(1)';
      overlay.style.transform = 'scaleX(1)';
    }

    switchCameraBtn.onclick = () => {
      usingFrontCamera = !usingFrontCamera;
      startCamera();
    };

    // Tirar foto
    captureBtn.onclick = () => {
      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings();
      canvas.width = settings.width;
      canvas.height = settings.height;

      const ctx = canvas.getContext('2d');

      if (usingFrontCamera) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

      photoPreview.src = canvas.toDataURL('image/png');
      previewContainer.style.display = 'flex';
    };

    saveBtn.onclick = () => {
      const link = document.createElement('a');
      link.download = 'foto-moldura.png';
      link.href = photoPreview.src;
      link.click();

      if (isiOS) instructions.style.display = 'block';
    };

    retryBtn.onclick = () => {
      previewContainer.style.display = 'none';
      instructions.style.display = 'none';
    };

    startCamera();
  </script>

</body>
</html>
