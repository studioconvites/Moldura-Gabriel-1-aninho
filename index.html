<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANTHONY FAZ 1 ANINHO</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #video, #overlay, #beautyCanvas {
      position: absolute;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #overlay { pointer-events: none; }

    #buttons {
      position: absolute;
      bottom: 50px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }

    button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #preview-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    #photo-preview {
      width: 85vw;
      max-width: 280px;
      border: 3px solid white;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    #save-btn, #retry-btn {
      background: #fcd42d;
      color: white;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 15px;
      margin-top: 5px;
      width: 160px;
    }

    #instructions {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      background-color: rgba(0,0,0,0.6);
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
      text-align: center;
      max-width: 90%;
    }

  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="beautyCanvas"></canvas>
  <img id="overlay" src="moldura.png" alt="moldura" />

  <div id="buttons">
    <button id="switch-camera">🔄</button>
    <button id="capture">📸</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div id="preview-container">
    <img id="photo-preview" />
    <button id="save-btn">Salvar na galeria</button>
    <button id="retry-btn">Tirar outra</button>

    <div id="instructions">
      Se estiver no iPhone:<br>
      Toque e segure a imagem e selecione “Salvar na Fototeca”.
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const beautyCanvas = document.getElementById('beautyCanvas');
    const overlay = document.getElementById('overlay');
    const canvas = document.getElementById('canvas');

    const switchCameraBtn = document.getElementById('switch-camera');
    const captureBtn = document.getElementById('capture');

    const previewContainer = document.getElementById('preview-container');
    const photoPreview = document.getElementById('photo-preview');
    const saveBtn = document.getElementById('save-btn');
    const retryBtn = document.getElementById('retry-btn');
    const instructions = document.getElementById('instructions');

    let usingFrontCamera = true;
    let stream;

    const ctxBeauty = beautyCanvas.getContext("2d");

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: usingFrontCamera ? "user" : "environment",
        }
      });

      video.srcObject = stream;
      video.style.transform = usingFrontCamera ? "scaleX(-1)" : "scaleX(1)";

      requestAnimationFrame(beautyLoop);
    }

    // 📌 Loop de suavização da pele
    function beautyLoop() {
      const w = beautyCanvas.width = video.videoWidth;
      const h = beautyCanvas.height = video.videoHeight;

      if (w && h) {
        ctxBeauty.filter = "blur(4px) brightness(1.05)"; 
        ctxBeauty.drawImage(video, 0, 0, w, h);

        ctxBeauty.globalAlpha = 0.65; 
        ctxBeauty.filter = "none";
        ctxBeauty.drawImage(video, 0, 0, w, h);

        ctxBeauty.globalAlpha = 1;
      }

      requestAnimationFrame(beautyLoop);
    }

    // Trocar câmera
    switchCameraBtn.onclick = () => {
      usingFrontCamera = !usingFrontCamera;
      startCamera();
    };

    // Tirar foto
    captureBtn.onclick = () => {
      const w = canvas.width = beautyCanvas.width;
      const h = canvas.height = beautyCanvas.height;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(beautyCanvas, 0, 0, w, h);
      ctx.drawImage(overlay, 0, 0, w, h);

      photoPreview.src = canvas.toDataURL("image/png");
      previewContainer.style.display = "flex";
    };

    saveBtn.onclick = () => {
      const link = document.createElement("a");
      link.download = "foto-moldura.png";
      link.href = photoPreview.src;
      link.click();
    };

    retryBtn.onclick = () => {
      previewContainer.style.display = "none";
    };

    startCamera();
  </script>

</body>
</html>
